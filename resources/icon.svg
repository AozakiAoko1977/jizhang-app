<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Horse head silhouette -->
  <g transform="translate(256,180)">
    <!-- Horse body -->
    <ellipse cx="-20" cy="80" rx="80" ry="50" fill="#0f3460" transform="rotate(-10)"/>
    <!-- Horse head -->
    <ellipse cx="60" cy="-20" rx="55" ry="40" fill="#1677ff" transform="rotate(-15)"/>
    <!-- Horse neck -->
    <ellipse cx="10" cy="40" rx="30" ry="60" fill="#1a56db" transform="rotate(-10)"/>
    <!-- Mane -->
    <path d="M 80,-60 Q 40,-100 0,-80" stroke="#69b1ff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 60,-55 Q 20,-95 -20,-70" stroke="#69b1ff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="80" cy="-30" r="6" fill="#ffd700"/>
    <!-- Ear -->
    <polygon points="50,-65 65,-100 75,-60" fill="#1a56db"/>
  </g>
  <!-- Money symbol ¥ -->
  <text x="256" y="410" text-anchor="middle" font-size="120" font-weight="bold" fill="#1677ff" font-family="Arial">¥</text>
  <!-- App name -->
  <text x="256" y="470" text-anchor="middle" font-size="36" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">黑马记账</text>
</svg>
